target-version = "py39"
line-length = 100
extend-include = ["bin/arcsv"]

[lint]
# pyflakes, pycodestyle errors, and bugbear (catches undefined names, broken
# .format() calls, mutable default arguments, etc.)
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E731",  # lambda assignment -- used deliberately for small closures
    "E741",  # ambiguous variable names (l, I, O)
]
